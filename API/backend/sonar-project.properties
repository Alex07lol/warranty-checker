# SonarCloud / SonarQube project configuration
sonar.projectKey=Alex07lol_warranty-checker
sonar.projectName=WarrantyVault
sonar.projectVersion=1.0.0

# Source
sonar.sources=src,public/js
sonar.exclusions=node_modules/**,tests/**,coverage/**,public/js/vendor/**

# Tests
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js

# Coverage (optional, generated by Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Host - defaults to SonarCloud
sonar.host.url=https://sonarcloud.io
sonar.organization=alex07lol
